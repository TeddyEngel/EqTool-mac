name: mac-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # Restore only the two packages.config projects this build needs. Restoring the
      # solution would drag in EQToolApis (SDK-style, net9.0), which nuget.exe hands to
      # msbuild restore and which would then require the .NET 9 SDK on the runner.
      # -SolutionDirectory puts packages in .\packages, matching the ..\packages HintPaths.
      - name: NuGet restore
        shell: pwsh
        run: |
          nuget restore EQTool\packages.config -SolutionDirectory .
          nuget restore EQToolShared\packages.config -SolutionDirectory .

      - name: Build EQTool (Mac configuration)
        shell: pwsh
        run: msbuild EQTool\EQTool.csproj /p:Configuration=Mac /p:Platform=AnyCPU /m /v:minimal

      - name: Verify EQTool.exe exists
        shell: pwsh
        run: |
          $exe = "EQTool\bin\Mac\EQTool.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Build produced no EQTool.exe at $exe"
            Get-ChildItem -Recurse EQTool\bin -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            exit 1
          }
          Write-Host "Found $exe ($((Get-Item $exe).Length) bytes)"

      - name: Upload EQTool-Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQTool-Mac
          path: EQTool/bin/Mac/
          if-no-files-found: error

  # macos-13 is the Intel runner. Both native projects pin
  # RuntimeIdentifier=osx-x64, and the current default macOS runner is arm64,
  # which would need Rosetta to execute the test binaries.
  native:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build native client
        run: dotnet build native/EQTool.Avalonia/EQTool.Avalonia.csproj -c Release --no-incremental

      - name: Test EQTool.Avalonia
        run: dotnet test native/EQTool.Avalonia.Tests/EQTool.Avalonia.Tests.csproj -c Release --verbosity minimal

      # The excluded classes are upstream tests that assert Windows path
      # semantics. Path.GetFileName does not treat a backslash as a separator on
      # Unix, so C:\Everquest never splits and they cannot pass on macOS. The
      # remaining 494 are the ones that mean anything here.
      - name: Test EQTool.Core
        run: >
          dotnet test native/EQTool.Core.Tests/EQTool.Core.Tests.csproj
          -c Release --verbosity minimal
          --filter "FullyQualifiedName!~SimplePathCombineTests&FullyQualifiedName!~ProgramPathCombineTests&FullyQualifiedName!~DirectoryCombineTests&FullyQualifiedName!~ParsesFullPath"
