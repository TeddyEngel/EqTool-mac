name: mac-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # Restore only the two packages.config projects this build needs. Restoring the
      # solution would drag in EQToolApis (SDK-style, net9.0), which nuget.exe hands to
      # msbuild restore and which would then require the .NET 9 SDK on the runner.
      # -SolutionDirectory puts packages in .\packages, matching the ..\packages HintPaths.
      - name: NuGet restore
        shell: pwsh
        run: |
          nuget restore EQTool\packages.config -SolutionDirectory .
          nuget restore EQToolShared\packages.config -SolutionDirectory .

      - name: Build EQTool (Mac configuration)
        shell: pwsh
        run: msbuild EQTool\EQTool.csproj /p:Configuration=Mac /p:Platform=AnyCPU /m /v:minimal

      - name: Verify EQTool.exe exists
        shell: pwsh
        run: |
          $exe = "EQTool\bin\Mac\EQTool.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Build produced no EQTool.exe at $exe"
            Get-ChildItem -Recurse EQTool\bin -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            exit 1
          }
          Write-Host "Found $exe ($((Get-Item $exe).Length) bytes)"

      - name: Upload EQTool-Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQTool-Mac
          path: EQTool/bin/Mac/
          if-no-files-found: error

  # EQTool.Core and its tests are AnyCPU, and EQTool.Core references no other
  # project, so nothing here depends on the architecture and this runs on the
  # readily scheduled arm64 image.
  native-core:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned exactly. On a newer 9.0.x SDK, EQTool.Core fails to compile:
      # CompleteHealCommsHandler.cs line 144 is `_ = splits.Reverse()` on a
      # string[], which binds to a void returning overload there and to
      # Enumerable.Reverse here. See PORT-NOTES, the two have different
      # behaviour as well as different return types.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.102

      # The excluded classes are upstream tests that assert Windows path
      # semantics. Path.GetFileName does not treat a backslash as a separator on
      # Unix, so C:\Everquest never splits and they cannot pass on macOS. The
      # remaining 494 are the ones that mean anything here.
      # working-directory matters here. global.json is resolved from the current
      # directory rather than the project path, so running this from the repo
      # root would silently ignore native/global.json and pick the newest SDK
      # on the image.
      - name: Test EQTool.Core
        working-directory: native
        run: >
          dotnet test EQTool.Core.Tests/EQTool.Core.Tests.csproj
          -c Release --verbosity minimal
          --filter "FullyQualifiedName!~SimplePathCombineTests&FullyQualifiedName!~ProgramPathCombineTests&FullyQualifiedName!~DirectoryCombineTests&FullyQualifiedName!~ParsesFullPath"

  package:
    runs-on: macos-14
    steps:
      # The build script derives its version from git describe, which needs
      # more than the default shallow checkout.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.102

      - name: Build PigParse.app
        run: ./mac/build-app.command

      # ditto rather than zip, so the executable bit on the launcher and the
      # bundle's symlinks survive the round trip through the artifact store.
      - name: Archive the bundle
        run: ditto -c -k --keepParent dist/PigParse.app dist/PigParse-mac-universal.zip

      - name: Upload PigParse.app
        uses: actions/upload-artifact@v4
        with:
          name: PigParse-mac-universal
          path: dist/PigParse-mac-universal.zip
          if-no-files-found: error

  native-client:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.102

      - name: Build native client
        working-directory: native
        run: dotnet build EQTool.Avalonia/EQTool.Avalonia.csproj -c Release --no-incremental

      - name: Test EQTool.Avalonia
        working-directory: native
        run: dotnet test EQTool.Avalonia.Tests/EQTool.Avalonia.Tests.csproj -c Release --verbosity minimal
